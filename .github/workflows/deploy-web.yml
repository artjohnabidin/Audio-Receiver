name: Deploy Flutter Web to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-flutter-web-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      WEBRTC_ICE_SERVERS: ${{ vars.WEBRTC_ICE_SERVERS || '[{"urls":"stun:stun.l.google.com:19302"}]' }}
      SPEECH_TOKEN_URL: ${{ secrets.SPEECH_TOKEN_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate production configuration
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Set the SUPABASE_URL repository variable."; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "::error::Set the SUPABASE_KEY repository secret (public anon or publishable key only)."; exit 1; }
          test -n "$SPEECH_TOKEN_URL" || { echo "::error::Set the SPEECH_TOKEN_URL repository secret (public anon or publishable key only)."; exit 1; }
          printf '%s' "$WEBRTC_ICE_SERVERS" | jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and has("urls"))' > /dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        shell: bash
        run: |
          flutter build web --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_KEY=$SUPABASE_KEY" \
            --dart-define="WEBRTC_ICE_SERVERS=$WEBRTC_ICE_SERVERS" \
            --dart-define="SPEECH_TOKEN_URL=$SPEECH_TOKEN_URL"

      - name: Deploy to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: build/web
          output_location: ""
          skip_app_build: true
          skip_api_build: true
